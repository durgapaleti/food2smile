<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Food Before You Go - Food2Smile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-heart-pulse-fill me-2 text-warning"></i>Food2<span>Smile</span>
      </a>
      <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="find-food.html">Find Food</a></li>
          <li class="nav-item"><a class="nav-link" href="share-food.html">Share Food</a></li>
          <li class="nav-item"><a class="nav-link active" href="going-away.html">Going Away</a></li>
          <li class="nav-item"><a class="nav-link" href="my-foods.html">My Foods</a></li>
          <li class="nav-item"><a class="nav-link" href="requests.html">Requests</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        </ul>
        <div id="navbarAuthSection" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="going-away-banner mb-4">
          <div class="d-flex align-items-center gap-3">
            <i class="bi bi-airplane-fill text-warning fs-1"></i>
            <div>
              <h3 class="fw-bold text-dark mb-1">Save Your Food Before It Spoils</h3>
              <p class="mb-0 text-muted">If you are going away and have food that may spoil before you return, list it here so someone nearby can use it.</p>
            </div>
          </div>
        </div>

        <div class="form-card">
          <form id="goingAwayForm">
            <!-- Food Name -->
            <div class="mb-3">
              <label for="goingAwayName" class="form-label">Food Name <span class="text-danger">*</span></label>
              <input type="text" id="goingAwayName" class="form-control" placeholder="e.g. Milk Packets, Eggs, Fresh Vegetables" required>
            </div>

            <!-- Category & Quantity -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="goingAwayCategory" class="form-label">Category <span class="text-danger">*</span></label>
                <select id="goingAwayCategory" class="form-select" required>
                  <option value="" selected disabled>Select Category</option>
                  <option value="Vegetables">Vegetables</option>
                  <option value="Fruits">Fruits</option>
                  <option value="Dairy">Dairy</option>
                  <option value="Bakery">Bakery</option>
                  <option value="Cooked Food">Cooked Food</option>
                  <option value="Groceries">Groceries</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="goingAwayQuantity" class="form-label">Quantity <span class="text-danger">*</span></label>
                <input type="text" id="goingAwayQuantity" class="form-control" placeholder="e.g. 1 L, 6 eggs, 2 kg" required>
              </div>
            </div>

            <!-- Pickup Location -->
            <div class="mb-3">
              <label for="goingAwayLocation" class="form-label">Pickup Location / Area</label>
              <input type="text" id="goingAwayLocation" class="form-control" placeholder="e.g. Sector 14 Gate 2">
            </div>

            <!-- Price & Action Choice -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="goingAwayPrice" class="form-label">Original Price (₹)</label>
                <input type="number" id="goingAwayPrice" class="form-control" placeholder="50" min="0">
              </div>
              <div class="col-md-6">
                <label class="form-label d-block">Action Option</label>
                <div class="d-flex gap-3 pt-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="goingAwayAction" id="gaFree" value="Free" checked>
                    <label class="form-check-label fw-bold text-success" for="gaFree">Free</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="goingAwayAction" id="gaDonate" value="Donate">
                    <label class="form-check-label fw-bold text-danger" for="gaDonate">Donate</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="goingAwayAction" id="gaSell" value="Sell">
                    <label class="form-check-label fw-bold text-primary" for="gaSell">Sell</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Spoiling Date (NO leaving or return date required) -->
            <div class="mb-4">
              <label for="goingAwaySpoilingDate" class="form-label">Spoiling Date <span class="text-danger">*</span></label>
              <input type="date" id="goingAwaySpoilingDate" class="form-control" required>
              <div id="goingAwayWarningAlert" class="alert mt-2 d-none" role="alert"></div>
            </div>

            <button type="submit" class="btn btn-terracotta w-100 py-3 fs-5 rounded-2">
              Add Food Before You Go →
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <h5 class="fw-bold text-white mb-1"><i class="bi bi-heart-pulse-fill me-1 text-warning"></i> Food2Smile</h5>
      <p class="small text-white-50 mb-0">Turn Surplus into Smiles. ❤️</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
