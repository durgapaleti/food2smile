<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Food2Smile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-heart-pulse-fill me-2 text-warning"></i>Food2<span>Smile</span>
      </a>
      <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="find-food.html">Find Food</a></li>
          <li class="nav-item"><a class="nav-link" href="share-food.html">Share Food</a></li>
          <li class="nav-item"><a class="nav-link" href="going-away.html">Going Away</a></li>
          <li class="nav-item"><a class="nav-link" href="my-foods.html">My Foods</a></li>
          <li class="nav-item"><a class="nav-link" href="requests.html">Requests</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        </ul>
        <div id="navbarAuthSection" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="form-card">
          <div class="auth-card-top-bar"></div>

          <!-- Header -->
          <div class="text-center mb-4 pt-2">
            <div class="d-inline-flex align-items-center justify-content-center bg-light-green text-success rounded-circle p-3 mb-2 shadow-sm" style="width:64px; height:64px;">
              <i class="bi bi-heart-pulse-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small mb-0">Turn surplus food into smiles around you. ❤️</p>
          </div>

          <!-- Dual Mode Tab Selector -->
          <div class="auth-tab-nav">
            <button type="button" class="auth-tab-btn active" id="tabPhoneBtn" onclick="switchLoginMode('phone')">
              <i class="bi bi-telephone-fill me-1"></i> Phone Number
            </button>
            <button type="button" class="auth-tab-btn" id="tabEmailBtn" onclick="switchLoginMode('email')">
              <i class="bi bi-envelope-fill me-1"></i> Email Address
            </button>
          </div>

          <!-- Alert Feedback -->
          <div id="authAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3"></div>

          <!-- Login Form -->
          <form id="loginForm">
            <!-- Mobile Field -->
            <div class="mb-3" id="phoneInputGroup">
              <label for="loginPhoneInput" class="form-label">Mobile Phone Number</label>
              <div class="input-group">
                <span class="input-group-text auth-input-icon fw-bold">+91</span>
                <input type="tel" id="loginPhoneInput" class="form-control" placeholder="9876543210" maxlength="10">
              </div>
            </div>

            <!-- Email Field -->
            <div class="mb-3 d-none" id="emailInputGroup">
              <label for="loginEmailInput" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text auth-input-icon"><i class="bi bi-envelope"></i></span>
                <input type="email" id="loginEmailInput" class="form-control" placeholder="funpanda06@gmail.com">
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="loginPassword" class="form-label mb-1">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text auth-input-icon"><i class="bi bi-lock"></i></span>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                <button type="button" class="input-group-text password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="loginSubmitBtn" class="btn btn-green w-100 py-2.5 fs-5 rounded-3 mb-3 d-flex align-items-center justify-content-center gap-2">
              <span>Log In</span> <i class="bi bi-arrow-right"></i>
            </button>

            <!-- Register Link -->
            <div class="text-center small text-muted">
              Don't have an account yet? <a href="register.html" class="text-success fw-bold text-decoration-none">Create an Account</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <h5 class="fw-bold text-white mb-1"><i class="bi bi-heart-pulse-fill me-1 text-warning"></i> Food2Smile</h5>
      <p class="small text-white-50 mb-0">Turn Surplus into Smiles. ❤️</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
